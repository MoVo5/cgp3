
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOVO 상점</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: #F5F3FF;
  color: #35358D;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 6%;
  background: white;
  box-shadow: 0 3px 16px #5551;
}

.logo {
  font-size: 28px;
  font-weight: 900;
}

.cash {
  padding: 12px 20px;
  border-radius: 30px;
  background: #FFF3C4;
  color: #8B6410;
  font-weight: bold;
  font-size: 18px;
}

main {
  width: min(1100px, 92%);
  margin: 40px auto 70px;
}

h1 {
  text-align: center;
  font-size: 34px;
}

.subtitle {
  text-align: center;
  color: #7775A8;
  margin-bottom: 35px;
}

.shop-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

.product {
  overflow: hidden;
  border: 2px solid #E5E1FF;
  border-radius: 22px;
  background: white;
  box-shadow: 0 8px 22px #5143A00D;
}

.cover-wrap {
  padding: 14px;
  background: #FAF9FF;
}

.cover {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  display: block;
  border-radius: 13px;
}

.product-info {
  padding: 18px;
  text-align: center;
}

.product-name {
  font-size: 19px;
  font-weight: 800;
  margin: 0 0 12px;
}

.price {
  font-size: 19px;
  font-weight: 900;
  color: #A77A16;
  margin-bottom: 18px;
}

.buy {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 13px;
  background: #7772D8;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.buy:hover {
  background: #5F59C4;
  transform: translateY(-2px);
}

.buy:disabled {
  opacity: 0.6;
  cursor: wait;
  transform: none;
}

.coming {
  min-height: 390px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px dashed #D9D4F5;
  border-radius: 22px;
  background: #F0EEFF;
  color: #AAA6D0;
  font-size: 22px;
  font-weight: bold;
}

/* 중앙 팝업 */

.modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: #211B4D88;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: min(420px, 100%);
  padding: 35px 25px;
  border: 3px solid #E7E3FF;
  border-radius: 25px;
  background: white;
  text-align: center;
  box-shadow: 0 15px 45px #17104433;
  animation: pop 0.2s ease-out;
}

@keyframes pop {
  from {
    opacity: 0;
    transform: scale(.85);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.modal-icon {
  font-size: 45px;
  margin-bottom: 15px;
}

.modal-message {
  font-size: 20px;
  line-height: 1.6;
  font-weight: bold;
  margin-bottom: 25px;
}

.modal-close {
  padding: 12px 35px;
  border: none;
  border-radius: 12px;
  background: #7772D8;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

@media(max-width:760px) {
  .shop-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  .coming {
    min-height: 260px;
  }

  h1 {
    font-size: 28px;
  }
}

@media(max-width:460px) {
  header {
    padding: 16px 4%;
  }

  .logo {
    font-size: 22px;
  }

  .cash {
    font-size: 14px;
    padding: 10px;
  }

  .product-info {
    padding: 12px 8px;
  }

  .product-name {
    font-size: 15px;
  }

  .price {
    font-size: 16px;
  }

  .buy {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">✦ MOVO 상점</div>

  <div class="cash">
    내 캐시 <span id="cashBalance">0</span> 💎
  </div>
</header>

<main>

  <h1>공부 자료 상점</h1>

  <p class="subtitle">
    필요한 교재를 캐시로 구매해 보세요!
  </p>

  <section class="shop-grid">

    <!-- 국어 -->
    <article class="product">

      <div class="cover-wrap">
        <img
          class="cover"
          src="./images/표지_국어.png"
          alt="국어 교재 표지"
        >
      </div>

      <div class="product-info">

        <p class="product-name">1학년 국어 교재</p>

        <p class="price">1,000 💎</p>

        <button class="buy"
          onclick="buyProduct('korean', this)">
          구매하기
        </button>

      </div>
    </article>

    <!-- 수학 -->
    <article class="product">

      <div class="cover-wrap">
        <img
          class="cover"
          src="./images/표지_수학.png"
          alt="수학 교재 표지"
        >
      </div>

      <div class="product-info">

        <p class="product-name">1학년 수학 교재</p>

        <p class="price">1,000 💎</p>

        <button class="buy"
          onclick="buyProduct('math', this)">
          구매하기
        </button>

      </div>
    </article>

    <!-- 영어 -->
    <article class="product">

      <div class="cover-wrap">
        <img
          class="cover"
          src="./images/표지_영어.png"
          alt="영어 교재 표지"
        >
      </div>

      <div class="product-info">

        <p class="product-name">1학년 영어 교재</p>

        <p class="price">1,000 💎</p>

        <button class="buy"
          onclick="buyProduct('english', this)">
          구매하기
        </button>

      </div>
    </article>

    <!-- 준비중 -->
    <div class="coming">아직 준비중</div>
    <div class="coming">아직 준비중</div>
    <div class="coming">아직 준비중</div>

  </section>

</main>

<!-- 팝업 -->
<div class="modal" id="messageModal">

  <div class="modal-box">

    <div class="modal-icon" id="modalIcon">💎</div>

    <p class="modal-message" id="modalMessage"></p>

    <button class="modal-close" onclick="closeModal()">
      확인
    </button>

  </div>

</div>

<script>

/* =================================
   1. 기존 사이트 캐시 연동
================================= */

const CASH_KEY = "studyExerciseCash";

const PRODUCT_PRICE = 1000;

/*
  cgp2 사이트와 동일한 localStorage 키 사용
  숫자 변환 과정에서 쉼표도 제거
*/

function getCash() {

  const savedCash = localStorage.getItem(CASH_KEY);

  const cash = Number(
    String(savedCash ?? "0").replace(/,/g, "").trim()
  );

  return Number.isFinite(cash) && cash >= 0
    ? cash
    : 0;

}


/* =================================
   2. 캐시 실시간 표시
================================= */

function updateCash() {

  const cash = getCash();

  document.getElementById("cashBalance").textContent =
    cash.toLocaleString("ko-KR");

}

// 다른 탭에서 캐시가 변경되면 즉시 반영
window.addEventListener("storage", function(event) {

  if (event.key === CASH_KEY || event.key === null) {
    updateCash();
  }

});

// 같은 탭에서 변경되는 경우도 확인
// 0.25초마다 최신 캐시 확인
setInterval(updateCash, 250);

// 처음 접속할 때 캐시 표시
updateCash();


/* =================================
   3. 팝업 기능
================================= */

function showModal(message, icon) {

  document.getElementById("modalMessage").textContent =
    message;

  document.getElementById("modalIcon").textContent =
    icon;

  document.getElementById("messageModal").classList.add("show");

}

function closeModal() {

  document.getElementById("messageModal").classList.remove("show");

}


/* =================================
   4. PDF 파일 경로
================================= */

const products = {

  korean: {
    name: "1학년_국어.pdf",
    url: "./files/1학년_국어.pdf"
  },

  math: {
    name: "1학년_수학.pdf",
    url: "./files/1학년_수학.pdf"
  },

  english: {
    name: "1학년_영어.pdf",
    url: "./files/1학년_영어.pdf"
  }

};


/* =================================
   5. 실제 PDF 다운로드
================================= */

function downloadPDF(product) {

  const link = document.createElement("a");

  link.href = product.url;

  link.download = product.name;

  link.style.display = "none";

  document.body.appendChild(link);

  link.click();

  link.remove();

}


/* =================================
   6. 교재 구매 기능
================================= */

function buyProduct(productId, button) {

  // 중복 클릭 방지
  if (button.disabled) {
    return;
  }

  const product = products[productId];

  if (!product) {
    showModal("상품 정보를 찾을 수 없습니다.", "⚠️");
    return;
  }

  // 현재 캐시를 숫자로 가져오기
  const currentCash = getCash();

  // 가격도 숫자로 비교
  const price = Number(PRODUCT_PRICE);

  /*
    예시:
    현재 캐시 = 2682
    교재 가격 = 1000

    2682 >= 1000 이므로 구매 가능
  */

  if (currentCash < price) {

    showModal(
      "캐시가 부족합니다! 운동을 하고 올까요?",
      "🏃"
    );

    return;

  }

  // 구매 전 잔액 다시 확인
  const remainingCash = currentCash - price;

  // 캐시 차감
  localStorage.setItem(
    CASH_KEY,
    String(remainingCash)
  );

  // 화면 즉시 업데이트
  updateCash();

  // 중복 구매 클릭 방지
  button.disabled = true;

  try {

    // 실제 PDF 다운로드 실행
    downloadPDF(product);

    // 구매 성공 팝업
    showModal(
      "구매하였습니다! 멋진 공부~",
      "🎉"
    );

  } catch (error) {

    console.error("PDF 다운로드 오류:", error);

    // 다운로드 실행에 실패한 경우 캐시 복구
    localStorage.setItem(
      CASH_KEY,
      String(currentCash)
    );

    updateCash();

    showModal(
      "다운로드를 시작하지 못했습니다. 다시 시도해 주세요.",
      "⚠️"
    );

  } finally {

    button.disabled = false;

  }

}

</script>

</body>
</html>
<img src="./images/표지_국어.png" alt="국어 교재">
<img src="./images/표지_수학.png" alt="수학 교재">
<img src="./images/표지_영어.png" alt="영어 교재">
<img src="./images/표지_과학.png" alt="과학 교재">
<img src="./images/표지_사회와문화.png" alt="사회와문화 교재">
