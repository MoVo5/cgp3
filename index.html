
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOVO 상점</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: #F5F3FF;
  color: #35358D;
}

/* 상단 */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 6%;
  background: white;
  box-shadow: 0 3px 16px #5551;
}

.logo {
  font-size: 28px;
  font-weight: 900;
}

.cash {
  padding: 11px 18px;
  border-radius: 30px;
  background: #FFF3C4;
  color: #8B6410;
  font-size: 17px;
  font-weight: bold;
}

/* 제목 */
main {
  width: min(1100px, 92%);
  margin: 38px auto 70px;
}

h1 {
  text-align: center;
  font-size: 34px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #7775A8;
  margin-bottom: 32px;
}

/* 상품 배치 */
.shop-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

.product,
.coming {
  overflow: hidden;
  border: 2px solid #E5E1FF;
  border-radius: 22px;
  background: white;
  box-shadow: 0 8px 22px #5143A00D;
}

.cover-wrap {
  padding: 14px;
  background: #FAF9FF;
}

.cover {
  display: block;
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  border-radius: 13px;
}

.product-info {
  padding: 18px;
  text-align: center;
}

.product-name {
  margin: 0 0 10px;
  font-size: 19px;
  font-weight: 800;
}

.price {
  margin: 0 0 16px;
  color: #8B6410;
  font-size: 18px;
  font-weight: 900;
}

/* 구매 버튼 */
.buy {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 13px;
  background: #7772D8;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

.buy:hover {
  background: #5F59C4;
  transform: translateY(-2px);
}

/* 준비중 */
.coming {
  min-height: 390px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg, white, #F0EEFF);
  color: #AAA6D0;
  font-size: 22px;
  font-weight: bold;
}

/* 팝업 배경 */
.modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #211B4D88;
}

.modal.show {
  display: flex;
}

/* 팝업 창 */
.modal-box {
  width: min(420px, 100%);
  padding: 34px 25px 25px;
  border: 3px solid #E7E3FF;
  border-radius: 25px;
  background: white;
  text-align: center;
  box-shadow: 0 15px 45px #17104433;
  animation: pop 0.2s ease-out;
}

@keyframes pop {
  from {
    opacity: 0;
    transform: scale(0.88);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.modal-icon {
  margin-bottom: 12px;
  font-size: 42px;
}

.modal-message {
  margin-bottom: 24px;
  color: #35358D;
  font-size: 20px;
  line-height: 1.5;
  font-weight: bold;
}

.modal-close {
  min-width: 120px;
  padding: 11px 24px;
  border: none;
  border-radius: 12px;
  background: #7772D8;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

/* 모바일 */
@media (max-width: 760px) {
  .shop-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  .coming {
    min-height: 280px;
    font-size: 18px;
  }

  h1 {
    font-size: 28px;
  }
}

@media (max-width: 460px) {
  header {
    padding: 17px 4%;
  }

  .logo {
    font-size: 23px;
  }

  .cash {
    padding: 9px 12px;
    font-size: 14px;
  }

  .shop-grid {
    gap: 10px;
  }

  .cover-wrap {
    padding: 8px;
  }

  .product-info {
    padding: 11px 9px;
  }

  .product-name {
    font-size: 16px;
  }

  .price {
    font-size: 15px;
  }

  .buy {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">✦ MOVO 상점</div>

  <div class="cash">
    내 캐시 <span id="cashBalance">0</span> 💎
  </div>
</header>

<main>

  <h1>공부 자료 상점</h1>
  <p class="subtitle">
    필요한 교재를 캐시로 구매해 보세요!
  </p>

  <section class="shop-grid">

    <!-- 국어 -->
    <article class="product">
      <div class="cover-wrap">
        <img
          class="cover"
          src="images/표지_국어.png"
          alt="국어 교재"
        >
      </div>

      <div class="product-info">
        <p class="product-name">1학년 국어 교재</p>
        <p class="price">1,000 💎</p>

        <button class="buy" onclick="buyProduct('korean')">
          구매하기
        </button>
      </div>
    </article>

    <!-- 수학 -->
    <article class="product">
      <div class="cover-wrap">
        <img
          class="cover"
          src="images/표지_수학.png"
          alt="수학 교재"
        >
      </div>

      <div class="product-info">
        <p class="product-name">1학년 수학 교재</p>
        <p class="price">1,000 💎</p>

        <button class="buy" onclick="buyProduct('math')">
          구매하기
        </button>
      </div>
    </article>

    <!-- 영어 -->
    <article class="product">
      <div class="cover-wrap">
        <img
          class="cover"
          src="images/표지_영어.png"
          alt="영어 교재"
        >
      </div>

      <div class="product-info">
        <p class="product-name">1학년 영어 교재</p>
        <p class="price">1,000 💎</p>

        <button class="buy" onclick="buyProduct('english')">
          구매하기
        </button>
      </div>
    </article>

    <!-- 준비중 -->
    <div class="coming">아직 준비중</div>
    <div class="coming">아직 준비중</div>
    <div class="coming">아직 준비중</div>

  </section>

</main>

<!-- 구매 결과 팝업 -->
<div class="modal" id="messageModal">

  <div class="modal-box">

    <div class="modal-icon" id="modalIcon">💎</div>

    <p class="modal-message" id="modalMessage"></p>

    <button class="modal-close" onclick="closeModal()">
      확인
    </button>

  </div>

</div>

<script>

/* 캐시 설정 */
const CASH_KEY = "studyExerciseCash";
const PRICE = 1000;

/* PDF 파일 경로 */
const products = {

  korean: "files/1학년_국어.pdf",

  math: "files/1학년_수학.pdf",

  english: "files/1학년_영어.pdf"

};

/* 현재 캐시 가져오기 */
function getCash() {

  return Number(localStorage.getItem(CASH_KEY)) || 0;

}

/* 캐시 화면 업데이트 */
function updateCash() {

  document.getElementById("cashBalance").textContent =
    getCash().toLocaleString("ko-KR");

}

/* 팝업 표시 */
function showModal(message, icon) {

  document.getElementById("modalMessage").textContent =
    message;

  document.getElementById("modalIcon").textContent =
    icon;

  document.getElementById("messageModal").classList.add("show");

}

/* 팝업 닫기 */
function closeModal() {

  document.getElementById("messageModal").classList.remove("show");

}

/* 교재 구매 */
function buyProduct(productId) {

  const currentCash = getCash();

  /* 캐시 부족 */
  if (currentCash < PRICE) {

    showModal(
      "캐시가 부족합니다! 운동을 하고 올까요?",
      "🏃"
    );

    return;

  }

  /* 캐시 차감 */
  const remainingCash = currentCash - PRICE;

  localStorage.setItem(
    CASH_KEY,
    String(remainingCash)
  );

  updateCash();

  /* 구매 성공 팝업 */
  showModal(
    "구매하였습니다! 멋진 공부~",
    "🎉"
  );

  /* PDF 다운로드 */
  const link = document.createElement("a");

  link.href = products[productId];

  link.download = products[productId].split("/").pop();

  document.body.appendChild(link);

  link.click();

  link.remove();

}

/* 다른 탭에서 캐시 변경 시 업데이트 */
window.addEventListener("storage", updateCash);

/* 처음 화면에 캐시 표시 */
updateCash();

</script>

</body>
</html>
