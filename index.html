
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOVO 상점</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: #F5F3FF;
  color: #35358D;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 6%;
  background: white;
  box-shadow: 0 3px 16px #5551;
}

.logo {
  font-size: 28px;
  font-weight: 900;
}

.cash {
  padding: 12px 20px;
  border-radius: 30px;
  background: #FFF3C4;
  color: #8B6410;
  font-weight: bold;
  font-size: 18px;
}

main {
  width: min(1100px, 92%);
  margin: 40px auto 70px;
}

h1 {
  text-align: center;
  font-size: 34px;
}

.subtitle {
  text-align: center;
  color: #7775A8;
  margin-bottom: 35px;
}

.shop-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

.product {
  overflow: hidden;
  border: 2px solid #E5E1FF;
  border-radius: 22px;
  background: white;
  box-shadow: 0 8px 22px #5143A00D;
}

.cover-wrap {
  padding: 14px;
  background: #FAF9FF;
}

.cover {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  display: block;
  border-radius: 13px;
}

.product-info {
  padding: 18px;
  text-align: center;
}

.product-name {
  font-size: 19px;
  font-weight: 800;
  margin: 0 0 12px;
}

.price {
  font-size: 19px;
  font-weight: 900;
  color: #A77A16;
  margin-bottom: 18px;
}

.buy {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 13px;
  background: #7772D8;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.buy:hover {
  background: #5F59C4;
  transform: translateY(-2px);
}

.buy:disabled {
  opacity: 0.6;
  cursor: wait;
  transform: none;
}

.coming {
  min-height: 390px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px dashed #D9D4F5;
  border-radius: 22px;
  background: #F0EEFF;
  color: #AAA6D0;
  font-size: 22px;
  font-weight: bold;
}

/* 중앙 팝업 */

.modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: #211B4D88;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: min(420px, 100%);
  padding: 35px 25px;
  border: 3px solid #E7E3FF;
  border-radius: 25px;
  background: white;
  text-align: center;
  box-shadow: 0 15px 45px #17104433;
  animation: pop 0.2s ease-out;
}

@keyframes pop {
  from {
    opacity: 0;
    transform: scale(.85);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

.modal-icon {
  font-size: 45px;
  margin-bottom: 15px;
}

.modal-message {
  font-size: 20px;
  line-height: 1.6;
  font-weight: bold;
  margin-bottom: 25px;
}

.modal-close {
  padding: 12px 35px;
  border: none;
  border-radius: 12px;
  background: #7772D8;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

@media(max-width:760px) {
  .shop-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  .coming {
    min-height: 260px;
  }

  h1 {
    font-size: 28px;
  }
}

@media(max-width:460px) {
  header {
    padding: 16px 4%;
  }

  .logo {
    font-size: 22px;
  }

  .cash {
    font-size: 14px;
    padding: 10px;
  }

  .product-info {
    padding: 12px 8px;
  }

  .product-name {
    font-size: 15px;
  }

  .price {
    font-size: 16px;
  }

  .buy {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">✦ MOVO 상점</div>

  <div class="cash">
    내 캐시 <span id="cashBalance">0</span> 💎
  </div>
</header>

<main>

  <h1>공부 자료 상점</h1>

  <p class="subtitle">
    필요한 교재를 캐시로 구매해 보세요!
  </p>

  <section class="shop-grid">

    <!-- 국어 -->
    <article class="product">
      <div class="cover-wrap">
        <img
          class="cover"
          src="./images/표지_국어.png"
          alt="국어 교재 표지"
        >
      </div>

      <div class="product-info">
        <p class="product-name">1학년 국어 교재</p>
        <p class="price">1,000 💎</p>

        <button class="buy"
          onclick="buyProduct('korean', this)">
          구매하기
        </button>
      </div>
    </article>

    <!-- 수학 -->
    <article class="product">
      <div class="cover-wrap">
        <img
          class="cover"
          src="./images/표지_수학.png"
          alt="수학 교재 표지"
        >
      </div>

      <div class="product-info">
        <p class="product-name">1학년 수학 교재</p>
        <p class="price">1,000 💎</p>

        <button class="buy"
          onclick="buyProduct('math', this)">
          구매하기
        </button>
      </div>
    </article>

    <!-- 영어 -->
    <article class="product">
      <div class="cover-wrap">
        <img
          class="cover"
          src="./images/표지_영어.png"
          alt="영어 교재 표지"
        >
      </div>

      <div class="product-info">
        <p class="product-name">1학년 영어 교재</p>
        <p class="price">1,000 💎</p>

        <button class="buy"
          onclick="buyProduct('english', this)">
          구매하기
        </button>
      </div>
    </article>

    <!-- 과학 -->
    <article class="product">
      <div class="cover-wrap">
        <img
          class="cover"
          src="./images/표지_과학.png"
          alt="과학 교재 표지"
        >
      </div>

      <div class="product-info">
        <p class="product-name">2학년 과학 교재</p>
        <p class="price">1,000 💎</p>

        <button class="buy"
          onclick="buyProduct('science', this)">
          구매하기
        </button>
      </div>
    </article>

    <!-- 사회와 문화 -->
    <article class="product">
      <div class="cover-wrap">
        <img
          class="cover"
          src="./images/표지_사회와문화.png"
          alt="사회와 문화 교재 표지"
        >
      </div>

      <div class="product-info">
        <p class="product-name">2학년 사회와 문화 교재</p>
        <p class="price">1,000 💎</p>

        <button class="buy"
          onclick="buyProduct('society', this)">
          구매하기
        </button>
      </div>
    </article>

    <!-- 준비중 -->
    <div class="coming">아직 준비중</div>
    <div class="coming">아직 준비중</div>
    <div class="coming">아직 준비중</div>

  </section>

</main>

<!-- 팝업 -->
<div class="modal" id="messageModal">

  <div class="modal-box">

    <div class="modal-icon" id="modalIcon">💎</div>

    <p class="modal-message" id="modalMessage"></p>

    <button class="modal-close" onclick="closeModal()">
      확인
    </button>

  </div>

</div>

<script>

/* =================================
   1. 기존 운동 사이트 캐시 연동
================================= */

const CASH_KEY = "studyExerciseCash";

const PRODUCT_PRICE = 1000;

function getCash() {

  const savedCash = localStorage.getItem(CASH_KEY);

  const cash = Number(
    String(savedCash ?? "0").replace(/,/g, "").trim()
  );

  return Number.isFinite(cash) && cash >= 0
    ? cash
    : 0;

}


/* =================================
   2. 캐시 실시간 표시
================================= */

function updateCash() {

  const cash = getCash();

  document.getElementById("cashBalance").textContent =
    cash.toLocaleString("ko-KR");

}

// 다른 탭에서 캐시가 변경되면 반영
window.addEventListener("storage", function(event) {

  if (event.key === CASH_KEY || event.key === null) {
    updateCash();
  }

});

// 캐시 변경 여부를 0.25초마다 확인
setInterval(updateCash, 250);

// 처음 접속할 때 캐시 표시
updateCash();


/* =================================
   3. 팝업 기능
================================= */

function showModal(message, icon) {

  document.getElementById("modalMessage").textContent =
    message;

  document.getElementById("modalIcon").textContent =
    icon;

  document.getElementById("messageModal").classList.add("show");

}

function closeModal() {

  document.getElementById("messageModal").classList.remove("show");

}


/* =================================
   4. PDF 파일 경로
================================= */

const products = {

  korean: {
    name: "1학년_국어.pdf",
    url: "./files/1학년_국어.pdf"
  },

  math: {
    name: "1학년_수학.pdf",
    url: "./files/1학년_수학.pdf"
  },

  english: {
    name: "1학년_영어.pdf",
    url: "./files/1학년_영어.pdf"
  },

  science: {
    name: "2학년_과학.pdf",
    url: "./files/2학년_과학.pdf"
  },

  society: {
    name: "2학년_사문.pdf",
    url: "./files/2학년_사문.pdf"
  }

};


/* =================================
   5. PDF 확인 및 다운로드
================================= */

async function downloadPDF(product) {

  // PDF 파일을 먼저 불러오기
  const response = await fetch(product.url);

  // 파일이 없으면 오류 발생
  if (!response.ok) {
    throw new Error("PDF 파일을 찾을 수 없습니다.");
  }

  const blob = await response.blob();

  // 실제 PDF 파일인지 확인
  const signature = await blob.slice(0, 5).text();

  if (signature !== "%PDF-") {
    throw new Error("올바른 PDF 파일이 아닙니다.");
  }

  return blob;

}


/* =================================
   6. 교재 구매 기능
================================= */

async function buyProduct(productId, button) {

  // 중복 클릭 방지
  if (button.disabled) {
    return;
  }

  const product = products[productId];

  if (!product) {

    showModal(
      "상품 정보를 찾을 수 없습니다.",
      "⚠️"
    );

    return;
  }

  // 현재 캐시 확인
  const currentCash = getCash();

  // 캐시 부족 확인
  if (currentCash < PRODUCT_PRICE) {

    showModal(
      "캐시가 부족합니다! 운동을 하고 올까요?",
      "🏃"
    );

    return;
  }

  button.disabled = true;

  try {

    // 먼저 PDF 파일이 실제로 있는지 확인
    const pdfBlob = await downloadPDF(product);

    // 다운로드 전에 최신 캐시 다시 확인
    const latestCash = getCash();

    if (latestCash < PRODUCT_PRICE) {

      showModal(
        "캐시가 부족합니다! 운동을 하고 올까요?",
        "🏃"
      );

      return;
    }

    // 캐시 차감
    const remainingCash = latestCash - PRODUCT_PRICE;

    localStorage.setItem(
      CASH_KEY,
      String(remainingCash)
    );

    // 캐시 화면 업데이트
    updateCash();

    // 실제 PDF 다운로드
    const blobUrl = URL.createObjectURL(pdfBlob);

    const link = document.createElement("a");

    link.href = blobUrl;
    link.download = product.name;
    link.style.display = "none";

    document.body.appendChild(link);

    link.click();

    link.remove();

    // 다운로드 주소 정리
    setTimeout(function() {
      URL.revokeObjectURL(blobUrl);
    }, 10000);

    // 구매 성공 팝업
    showModal(
      "구매하였습니다! 멋진 공부~",
      "🎉"
    );

  } catch (error) {

    console.error("구매 또는 PDF 다운로드 오류:", error);

    showModal(
      "PDF 파일을 찾을 수 없습니다. GitHub의 files 폴더와 파일 이름을 확인해 주세요.",
      "⚠️"
    );

  } finally {

    button.disabled = false;

  }

}

</script>

</body>
</html>
